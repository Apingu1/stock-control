server {
  listen 80;
  server_name _;

  # Browser-based opening stock migration accepts up to 5 MB UTF-8 CSV as JSON.
  # Allow JSON framing overhead in the Codespaces reverse proxy.
  client_max_body_size 8m;

  # ✅ API under /api/* (strip /api prefix before proxying)
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:8000/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Optional: keep old behaviour for root (fine for now)
  location / {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
