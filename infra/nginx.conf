server {
  listen 80;
  server_name _;

  # Browser-based opening stock migration accepts up to 5 MB UTF-8 CSV as JSON.
  # Allow JSON framing overhead in the Codespaces reverse proxy.
  client_max_body_size 8m;

  # Legacy BMR ZIPs may contain hundreds of Word documents.
  # The extractor enforces a 175 MB compressed ZIP cap; allow HTTP multipart framing.
  # Keep the ordinary routes on their smaller 8 MB default instead of
  # permitting large uploads throughout the application's API.
  location = /api/admin/bmr-extractor/start {
    client_max_body_size 200m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # Two canonical CSVs may each be up to 12 MB, and preview/commit sends
  # them together. The standalone extractor ZIP also uses this endpoint group.
  location ^~ /api/admin/bmr-migration/ {
    client_max_body_size 32m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # ✅ API under /api/* (strip /api prefix before proxying)
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:8000/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Optional: keep old behaviour for root (fine for now)
  location / {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
