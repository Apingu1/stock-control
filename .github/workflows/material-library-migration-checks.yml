name: StkFlo Materials Library Migration Checks

on:
  push:
    branches:
      - feature/stkflo-material-library-migration-v8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Compile Python modules
        run: |
          python -m compileall -q api/app
          python -m compileall -q api/tests
      - name: Run materials import tests
        working-directory: api
        run: |
          python -m unittest discover -s tests -p 'test_material_library_migration.py' -v
          python -m unittest discover -s tests -p 'test_opening_stock_migration.py' -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
