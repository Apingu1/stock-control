name: StkFlo Windows Management Validation
on:
  push:
    branches:
      - feature/stkflo-windows-deployment-remote-management
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all Windows PowerShell sources
        shell: pwsh
        run: |
          $failed = @()
          $sources = @(Get-ChildItem windows -Recurse -Filter '*.ps1' -File) + @(Get-ChildItem packaging/windows-commercial -Recurse -Filter '*.ps1' -File)
          foreach ($source in $sources) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($source.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed += "$($source.FullName) : $($errors | Out-String)"
            }
          }
          if ($failed.Count) { throw ($failed -join [Environment]::NewLine) }
          Write-Host "Parsed $($sources.Count) Windows PowerShell sources."
      - name: Build clean StkFlo release
        shell: powershell
        run: |
          & .\windows\Build-CommercialPackage.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check release structure, staging and manager files
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'release\StkFlo'
          $required = @(
            '01 - INSTALL SERVER.bat',
            'CLIENT DEPLOYMENT\01 - INSTALL CLIENT.bat',
            'CLIENT DEPLOYMENT\stkflo.ico',
            '05 - PUBLISH CLIENT DEPLOYMENT.bat',
            'Support\Publish-ClientDeployment.ps1',
            'System\web\public\branding\stkflo-login-loop.mp4',
            'System\web\public\branding\stkflo-login-poster.webp',
            'System\web\public\branding\stkflo-monogram.svg',
            'System\web\public\icons\stkflo-favicon.ico',
            'System\windows\management\Server-Management.ps1',
            'System\windows\management\Invoke-StackAction.ps1',
            'System\windows\management\Sync-Backups.ps1',
            'Administration & Recovery\03 - ENABLE VM MANAGEMENT.bat',
            'HOST MANAGEMENT\01 - INSTALL HOST MANAGER.bat',
            'HOST MANAGEMENT\Install-Manager.ps1',
            'HOST MANAGEMENT\Server-Management.ps1'
          )
          foreach($file in $required) {
            if(-not (Test-Path (Join-Path $root $file))) { throw "Missing release file: $file" }
          }
          if(-not (Test-Path 'release\StkFlo-Windows-Installation.zip')) { throw 'Missing release ZIP' }
          $installer = Get-Content (Join-Path $root '01 - INSTALL SERVER.bat') -Raw
          if($installer -notmatch 'StkFlo-Installer') { throw 'Server network staging is missing' }
          if($installer -notmatch 'ESC_SERVER_SETUP_WINDOWS.bat" --commercial') {
            throw 'Elevated server setup must exit without a blocking pause so N-share publication runs'
          }
          if($installer -notmatch 'call "%PACKAGE_ROOT%05 - PUBLISH CLIENT DEPLOYMENT.bat" --quiet') {
            throw 'The original network launch session must automatically publish client files after installation'
          }
          $serverSetup = Get-Content (Join-Path $root 'System\ESC_SERVER_SETUP_WINDOWS.bat') -Raw
          if($serverSetup -notmatch 'QUIET_COMMERCIAL' -or $serverSetup -notmatch 'Returning to the original commercial installer') {
            throw 'Server setup is not configured for uninterrupted commercial installation'
          }
          $client = Get-Content (Join-Path $root 'CLIENT DEPLOYMENT\01 - INSTALL CLIENT.bat') -Raw
          if($client -notmatch 'StkFlo-Client') { throw 'Client network staging is missing' }
          $hostsScript = Get-Content (Join-Path $root 'System\windows\Configure-Hosts.ps1') -Raw
          $clientHostsScript = Get-Content (Join-Path $root 'CLIENT DEPLOYMENT\Configure-Hosts.ps1') -Raw
          if ($hostsScript -ne $clientHostsScript) { throw 'Server and client hosts configuration scripts differ' }
          if ($hostsScript -match 'Join-Path\s+\$env:TEMP' -or $hostsScript -notmatch 'finally\s*\{') {
            throw 'Hosts-file staging must not depend on user TEMP, and cleanup must be protected'
          }
          Write-Host 'Release structure and hosts-file cleanup checks passed.'
      - name: Smoke-test trailing slash with source and destination containing spaces
        shell: powershell
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'StkFlo Installer Source With Spaces'
          $dest = Join-Path $env:RUNNER_TEMP 'StkFlo Installer Destination With Spaces'
          New-Item -Path $source -ItemType Directory -Force | Out-Null
          Set-Content -Path (Join-Path $source 'probe.txt') -Value 'success' -Encoding ascii
          $batch = Join-Path $env:RUNNER_TEMP 'verify-stkflo-robocopy.bat'
          $lines = @(
            '@echo off',
            'setlocal EnableExtensions EnableDelayedExpansion',
            ('set "PACKAGE_ROOT=' + $source + '\"'),
            ('robocopy "%PACKAGE_ROOT%." "' + $dest + '" /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /NFL /NDL /NP'),
            'if !ERRORLEVEL! GEQ 8 exit /b 1',
            'exit /b 0'
          )
          [IO.File]::WriteAllLines($batch, $lines)
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'ROBOCOPY quoted-path smoke test failed' }
          if (-not (Test-Path (Join-Path $dest 'probe.txt'))) { throw 'ROBOCOPY did not copy expected file' }
          $files = @(
            (Join-Path $PWD 'release\StkFlo\01 - INSTALL SERVER.bat'),
            (Join-Path $PWD 'release\StkFlo\CLIENT DEPLOYMENT\01 - INSTALL CLIENT.bat'),
            (Join-Path $PWD 'release\StkFlo\CLIENT DEPLOYMENT\02 - UNINSTALL CLIENT.bat'),
            (Join-Path $PWD 'release\StkFlo\HOST MANAGEMENT\01 - INSTALL HOST MANAGER.bat')
          )
          foreach ($file in $files) {
            $commands = @(Get-Content $file | Where-Object { $_ -match '^\s*robocopy ' })
            if (-not $commands -or $commands[0] -notmatch 'dp0\.|PACKAGE_ROOT%\.') {
              throw "Unsafe ROBOCOPY source path quoting in $file"
            }
          }
          Write-Host 'All shared-folder staging launchers use safe source path quoting.'
      - name: Test client CA publication from VM to extracted commercial release
        shell: powershell
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'StkFlo VM Installation With Spaces'
          $release = Join-Path $PWD 'release\StkFlo'
          $client = Join-Path $release 'CLIENT DEPLOYMENT'
          $vmClient = Join-Path $install 'client-deployment'
          $vmCerts = Join-Path $install 'infra\certs'
          $vmDeploy = Join-Path $install 'deployment'
          New-Item -ItemType Directory -Force -Path $vmClient,$vmCerts,$vmDeploy | Out-Null
          $cert = New-SelfSignedCertificate -Subject 'CN=StkFlo CI Test CA' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 2048 -NotAfter (Get-Date).AddDays(2)
          Export-Certificate -Cert $cert -FilePath (Join-Path $vmCerts 'stock-control-ca.crt') -Type CERT | Out-Null
          Copy-Item (Join-Path $vmCerts 'stock-control-ca.crt') (Join-Path $vmClient 'stock-control-ca.crt')
          Set-Content -Path (Join-Path $vmCerts 'stock-control-ca.key') -Value 'Never publish a private key.' -Encoding ascii
          # Elevated server setup has generated the real VM-local configuration.
          @('TLS_HOSTNAME=stkflo','SERVER_IP=192.168.1.153','APP_HTTPS_PORT=443') |
            Set-Content -Path (Join-Path $vmClient 'client-config.ini') -Encoding ascii
          # The original release on N: still contains its empty distribution template.
          @('TLS_HOSTNAME=stkflo','SERVER_IP=','APP_HTTPS_PORT=443') |
            Set-Content -Path (Join-Path $client 'client-config.ini') -Encoding ascii
          @('TLS_HOSTNAME=stkflo','SERVER_IP=192.168.1.153','APP_HTTP_PORT=8088','APP_HTTPS_PORT=443','INSTALL_ROOT=' + $install) |
            Set-Content -Path (Join-Path $vmDeploy 'server-config.ini') -Encoding ascii
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $release 'Support\Publish-ClientDeployment.ps1') -InstallRoot $install -Destination $client
          if ($LASTEXITCODE -ne 0) { throw 'Public CA publication integration test failed' }
          foreach ($required in @('stock-control-ca.crt','client-config.ini','STKFLO_CLIENT_DEPLOYMENT_READY.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $client $required) -PathType Leaf)) { throw "Unpublished client file: $required" }
          }
          if (Test-Path (Join-Path $client 'stock-control-ca.key')) { throw 'Private key leaked into commercial client deployment' }
          $configured = Get-Content (Join-Path $client 'client-config.ini')
          $installed = Get-Content (Join-Path $vmClient 'client-config.ini')
          if ($configured -notcontains 'SERVER_IP=192.168.1.153') { throw 'Published client server IP incorrect' }
          if ($installed -notcontains 'SERVER_IP=192.168.1.153') { throw 'Installed VM client config still has empty template IP' }
          if (@(Compare-Object -ReferenceObject $installed -DifferenceObject $configured).Count -ne 0) {
            throw 'Installed VM and original release client settings differ'
          }
          $published = Get-PfxCertificate (Join-Path $client 'stock-control-ca.crt')
          if ($published.Thumbprint -ne $cert.Thumbprint) { throw 'Published public CA thumbprint mismatch' }

          # Simulate a stale manually edited N: config, and ensure the next
          # publication overwrites it from the VM server rather than using it.
          @('TLS_HOSTNAME=stkflo','SERVER_IP=192.168.1.99','APP_HTTPS_PORT=443') |
            Set-Content -Path (Join-Path $client 'client-config.ini') -Encoding ascii
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $release 'Support\Publish-ClientDeployment.ps1') -InstallRoot $install -Destination $client
          if ($LASTEXITCODE -ne 0) { throw 'Repeated N-drive client publication failed' }
          $republished = Get-Content (Join-Path $client 'client-config.ini')
          if ($republished -contains 'SERVER_IP=192.168.1.99' -or
              $republished -notcontains 'SERVER_IP=192.168.1.153') {
            throw 'Publication preserved stale N-share IP rather than installed VM IP'
          }
          if (-not (Test-Path (Join-Path $client 'STKFLO_CLIENT_DEPLOYMENT_READY.txt'))) {
            throw 'Second publication did not produce a READY marker'
          }
          if (Test-Path (Join-Path $client 'stock-control-ca.key')) { throw 'Private CA key was published' }
          Write-Host 'Blank template IP, stale original-share IP and public CA publishing all corrected and verified.'
      - uses: actions/upload-artifact@v4
        with:
          name: StkFlo-Windows-Commercial-Package
          path: release/StkFlo/
          retention-days: 30
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compile the StkFlo administrator UI
        working-directory: web
        run: |
          npm ci
          npm run build

  api-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python services
        run: python -m compileall -q api/app
      - name: Check safe first-install administrator provisioning
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from types import SimpleNamespace
          source = Path('api/app/bootstrap_admin.py').read_text()
          sql = Path('db/init/phase-a_auth_users.sql').read_text()
          tree = ast.parse(source)
          assigned = next(n for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'SCHEMA_SEEDED_ADMIN_HASH' for t in n.targets))
          guard = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'is_unprovisioned_seed_admin')
          ns = {'User': object}
          exec(compile(ast.Module(body=[assigned, guard], type_ignores=[]), '<provisioning-test>', 'exec'), ns)
          seeded_hash = ns['SCHEMA_SEEDED_ADMIN_HASH']
          assert seeded_hash in sql, 'Schema placeholder and bootstrap guard have diverged'
          seeded = SimpleNamespace(username='admin', created_by='system', password_hash=seeded_hash)
          assert ns['is_unprovisioned_seed_admin'](seeded)
          for record in (
              SimpleNamespace(username='admin', created_by='system', password_hash='real-password-hash'),
              SimpleNamespace(username='admin', created_by='actual-admin', password_hash=seeded_hash),
              SimpleNamespace(username='operator', created_by='system', password_hash=seeded_hash),
          ):
              assert not ns['is_unprovisioned_seed_admin'](record), 'Non-placeholder administrator must not be reset'
          assert 'INITIALISED_SCHEMA_SEED' in source
          print('Safe seeded-admin initialisation regression checks passed')
          PY
      - name: Syntax check Linux production scripts
        run: find scripts db -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
