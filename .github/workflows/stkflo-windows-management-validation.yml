name: StkFlo Windows Management Validation
on:
  push:
    branches:
      - feature/stkflo-windows-deployment-remote-management
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all Windows PowerShell sources
        shell: pwsh
        run: |
          $failed = @()
          $sources = @(Get-ChildItem windows -Recurse -Filter '*.ps1' -File)
          foreach ($source in $sources) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($source.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed += "$($source.FullName) : $($errors | Out-String)"
            }
          }
          if ($failed.Count) { throw ($failed -join [Environment]::NewLine) }
          Write-Host "Parsed $($sources.Count) Windows PowerShell sources."
      - name: Build clean StkFlo release
        shell: powershell
        run: |
          & .\windows\Build-CommercialPackage.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check release structure, staging and manager files
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'release\StkFlo'
          $required = @(
            '01 - INSTALL SERVER.bat',
            'CLIENT DEPLOYMENT\01 - INSTALL CLIENT.bat',
            'CLIENT DEPLOYMENT\stkflo.ico',
            'System\web\public\branding\stkflo-login-loop.mp4',
            'System\web\public\branding\stkflo-login-poster.webp',
            'System\web\public\branding\stkflo-monogram.svg',
            'System\web\public\icons\stkflo-favicon.ico',
            'System\windows\management\Server-Management.ps1',
            'System\windows\management\Invoke-StackAction.ps1',
            'System\windows\management\Sync-Backups.ps1',
            'Administration & Recovery\03 - ENABLE VM MANAGEMENT.bat',
            'HOST MANAGEMENT\01 - INSTALL HOST MANAGER.bat',
            'HOST MANAGEMENT\Install-Manager.ps1',
            'HOST MANAGEMENT\Server-Management.ps1'
          )
          foreach($file in $required) {
            if(-not (Test-Path (Join-Path $root $file))) { throw "Missing release file: $file" }
          }
          if(-not (Test-Path 'release\StkFlo-Windows-Installation.zip')) { throw 'Missing release ZIP' }
          $installer = Get-Content (Join-Path $root '01 - INSTALL SERVER.bat') -Raw
          if($installer -notmatch 'StkFlo-Installer') { throw 'Server network staging is missing' }
          $client = Get-Content (Join-Path $root 'CLIENT DEPLOYMENT\01 - INSTALL CLIENT.bat') -Raw
          if($client -notmatch 'StkFlo-Client') { throw 'Client network staging is missing' }
          Write-Host 'Release structure checks passed.'
      - name: Smoke-test trailing slash with source and destination containing spaces
        shell: powershell
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'StkFlo Installer Source With Spaces'
          $dest = Join-Path $env:RUNNER_TEMP 'StkFlo Installer Destination With Spaces'
          New-Item -Path $source -ItemType Directory -Force | Out-Null
          Set-Content -Path (Join-Path $source 'probe.txt') -Value 'success' -Encoding ascii
          $batch = Join-Path $env:RUNNER_TEMP 'verify-stkflo-robocopy.bat'
          $lines = @(
            '@echo off',
            'setlocal EnableExtensions EnableDelayedExpansion',
            ('set "PACKAGE_ROOT=' + $source + '\ "').Replace('\ "','\"'),
            ('robocopy "%PACKAGE_ROOT%." "' + $dest + '" /E /COPY:DAT /DCOPY:DAT /R:2 /W:1 /NFL /NDL /NP'),
            'if !ERRORLEVEL! GEQ 8 exit /b 1',
            'exit /b 0'
          )
          [IO.File]::WriteAllLines($batch, $lines)
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'ROBOCOPY quoted-path smoke test failed' }
          if (-not (Test-Path (Join-Path $dest 'probe.txt'))) { throw 'ROBOCOPY did not copy expected file' }
          $files = @(
            (Join-Path $PWD 'release\StkFlo\01 - INSTALL SERVER.bat'),
            (Join-Path $PWD 'release\StkFlo\CLIENT DEPLOYMENT\01 - INSTALL CLIENT.bat'),
            (Join-Path $PWD 'release\StkFlo\CLIENT DEPLOYMENT\02 - UNINSTALL CLIENT.bat'),
            (Join-Path $PWD 'release\StkFlo\HOST MANAGEMENT\01 - INSTALL HOST MANAGER.bat')
          )
          foreach ($file in $files) {
            $commands = @(Get-Content $file | Where-Object { $_ -match '^\s*robocopy ' })
            if (-not $commands -or $commands[0] -notmatch 'dp0\.|PACKAGE_ROOT%\.') {
              throw "Unsafe ROBOCOPY source path quoting in $file"
            }
          }
          Write-Host 'All shared-folder staging launchers use safe source path quoting.'
      - uses: actions/upload-artifact@v4
        with:
          name: StkFlo-Windows-Commercial-Package
          path: release/StkFlo/
          retention-days: 30
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compile the StkFlo administrator UI
        working-directory: web
        run: |
          npm ci
          npm run build

  api-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python services
        run: python -m compileall -q api/app
      - name: Syntax check Linux production scripts
        run: find scripts db -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
