name: Opening stock migration checks

on:
  push:
    branches:
      - feature/stkflo-opening-stock-migration
  pull_request:
    paths:
      - "api/app/routers/opening_stock_migration.py"
      - "api/tests/test_opening_stock_migration.py"
      - "web/src/**"

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r api/requirements.txt
      - name: Test opening stock parser and valuation
        working-directory: api
        run: python -m unittest discover -s tests -p "test_opening_stock_migration.py"
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
