name: StkFlo Phase 05 Frontend Validation

on:
  push:
    branches:
      - feature/stkflo-workspace-dock-phase-05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript, design and draft lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: StkFlo UI source contracts
        working-directory: web
        run: |
          npm run check:design-system
          npm run check:adaptive-layout
          npm run check:operational-ui
          npm run check:admin-analytics-ui
          npm run check:workspace-dock
      - name: Compile TypeScript and build Vite
        working-directory: web
        run: npm run build
