name: StkFlo BMR Migration Integration

on:
  push:
    branches:
      - feature/stkflo-bmr-master-formula-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r api/requirements.txt
      - name: Verify schema upgrade shell scripts
        run: |
          bash -n scripts/apply_bmr_formula_schema.sh
          bash -n db/production-bootstrap.sh
      - name: Validate development Nginx routing and BMR upload limits
        run: |
          docker run --rm --add-host api:127.0.0.1 \
            -v "${GITHUB_WORKSPACE}/infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
          grep -q 'client_max_body_size 200m;' infra/nginx.conf
      - name: Compile backend modules
        run: |
          python -m compileall -q api/app
          python -m compileall -q api/tests
      - name: BMR extractor and opening stock regression tests
        working-directory: api
        run: |
          python -m unittest discover -s tests -p "test_bmr_extraction.py" -v
          python -m unittest discover -s tests -p "test_opening_stock_migration.py" -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
