name: StkFlo Flavouring Formula & Consumption Validation

on:
  push:
    branches:
      - fix/stkflo-materials-pagination-and-auto-code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r api/requirements.txt
      - name: Check backend syntax and SQL migration script
        run: |
          python -m compileall -q api/app api/tests
          bash -n db/production-bootstrap.sh
          bash -n scripts/apply_flavouring_schema.sh
      - name: Run flavour and stock control regressions
        working-directory: api
        run: |
          python -m unittest discover -s tests -p 'test_flavouring_formula_slots.py' -v
          python -m unittest discover -s tests -p 'test_stkflo_stock_integrity.py' -v
          python -m unittest discover -s tests -p 'test_consumption_packaging.py' -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
