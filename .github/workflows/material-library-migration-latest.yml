name: StkFlo Material Catalogue Migration Checks

on:
  push:
    branches:
      - feature/stkflo-bmr-master-formula-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Compile API
        run: python -m compileall -q api/app api/tests
      - name: Test materials and opening-stock import
        working-directory: api
        run: |
          python -m unittest discover -s tests -p 'test_material_library_migration.py' -v
          python -m unittest discover -s tests -p 'test_opening_stock_migration.py' -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install UI dependencies
        working-directory: web
        run: npm ci
      - name: Build production UI
        working-directory: web
        run: npm run build
